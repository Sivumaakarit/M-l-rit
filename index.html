        <h1>Mölyapinat - Energinen lastenmusiikkibändi keikalle ja tapahtumiin</h1>
        
        <section>
          <h2>Mitä Mölyapinat tekee?</h2>
          <p><strong>Mölyapinat</strong> on vuonna 2014 perustettu lohjalainen ammattimainen ja energinen lastenmusiikkiyhtye, joka soittaa osallistavaa, teatraalista ja vauhdikasta lastenmusiikkia. Bändi keikkailee aktiivisesti ympäri Suomen ja on tunnettu mukaansatempaavista esityksistään, joissa lapset pääsevät laulamaan, liikkumaan ja tanssimaan (kuten suositussa <em>Banaanitanssissa</em>).</p>
        </section>

        <section>
          <h2>Esiintymiset ja keikat</h2>
          <p>Mölyapinat esiintyy laajasti erilaisissa perhe- ja lastentapahtumissa:</p>
          <ul>
            <li>Päiväkodit ja perhepäivät</li>
            <li>Alakoulut ja oppilaitokset</li>
            <li>Kaupunkien kesätapahtumat ja kyläjuhlat</li>
            <li>Synttärit ja yksityisjuhlat</li>
            <li>Festarit ja suuret yleisötapahtumat</li>
          </ul>
          <p>Tapahtuman koon ja budjetin mukaan Mölyapinat esiintyy joustavasti eri kokoonpanoilla: täydellä 5-henkisellä bändillä, pienemmillä duo- ja triokokoonpanoilla, tai Make Mölyapina voi esiintyä yksin soolona.</p>
        </section>

        <section>
          <h2>Bändin jäsenet</h2>
          <ol>
            <li><strong>Make</strong> (laulu ja kitara) - Täynnä apinaenergiaa ja johtaa bändin musisointia.</li>
            <li><strong>Muka</strong> (basso ja laulu) - Vastaa matalista taajuuksista ja villeistä tanssiliikkeistä keltaisissa aurinkolaseissaan.</li>
            <li><strong>Mökä</strong> (rummut) - Vihreillä laseilla varustettu vauhdikas rumpali, joka tykkää pitää meteliä.</li>
            <li><strong>Bansku-Ansku</strong> (laulu) - Mölymetsän hattaraisin kampaus ja iloinen lauluääni.</li>
            <li><strong>Soffi</strong> (laulu ja tanssi) - Pitää apinalauman järjestyksessä ja opettaa lapsille tanssiaskeleet.</li>
          </ol>
        </section>

        <section>
          <h2>Mölyapinoiden musiikki</h2>
          <p>Mölyapinoiden ohjelmisto koostuu pääosin omista tarttuvista kappaleista sekä tutuista lauluista apinamaisilla sanoituksilla. Suosittuja kappaleita ovat muun muassa:</p>
          <ul>
            <li><em>Kolme banaania kulhossa</em> (uusi hittisinkku)</li>
            <li><em>Banaanitanssi</em> (musiikkivideo YouTubessa)</li>
            <li><em>Banaanin metsästys</em></li>
          </ul>
          <p>Musiikki on kuunneltavissa kaikissa suosituimmissa suoratoistopalveluissa, kuten Spotifyssa, Apple Musicissa, YouTubessa, Deezerissä ja Tidalissa.</p>
        </section>

        <section>
          <h2>Usein kysytyt kysymykset (FAQ)</h2>
          <dl>
            <dt><strong>Miten voin tilata Mölyapinat keikalle?</strong></dt>
            <dd>Voit ottaa yhteyttä sähköpostitse osoitteeseen <a href="mailto:jullenmusiikki@gmail.com">jullenmusiikki@gmail.com</a> tai täyttää verkkosivujemme yhteydenottolomakkeen. Keikkailemme kaikkialla Suomessa.</dd>
            
            <dt><strong>Sopiiko bändi pienempiin tapahtumiin tai rajalliselle budjetille?</strong></dt>
            <dd>Kyllä sopii! Esiintymiset onnistuvat pienillä duo- ja triokokoonpanoilla tai Make Mölyapina soolona, mikä sopii esimerkiksi päiväkotien ja synttäreiden budjetteihin.</dd>
            
            <dt><strong>Onko esitysten äänenvoimakkuus lapsiystävällinen?</strong></dt>
            <dd>Kyllä, huomioimme aina yleisön iän ja säädämme äänenvoimakkuuden tilan ja lapsiyleisön mukaan. Tarvittaessa voimme esiintyä myös täysin akustisesti ilman sähköistä vahvistusta.</dd>
          </dl>
        </section>
