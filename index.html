<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Mölyapinat - Lastenmusiikkibändi | Mölymetsän seikkailut</title>
    
    <meta name="description" content="Mölyapinat on energinen lastenmusiikkibändi, joka tuo iloa, musiikkia ja liikettä koko perheelle. Tervetuloa Mölymetsään!" />

    <link rel="icon" type="image/png" href="/apinalogo.png" />

    <meta property="og:title" content="Mölyapinat - Lasten Musiikkibändi" />
    <meta property="og:description" content="Tervetuloa Mölymetsään! Mölyapinat tuo iloa, musiikkia ja liikettä koko perheelle." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apinalogo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/apinalogo.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@400;500;600;700&display=swap" />
    </noscript>
    <link rel="canonical" href="https://molyapinat.fi" />
  </head>

  <body>
    <div id="root">
      <!-- Loading Screen / Splash Screen -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7f2ea;
        z-index: 9999;
        font-family: 'Quicksand', sans-serif;
      ">
        <img src="/logo.webp" alt="Mölyapinat" style="
          width: 50vw; 
          max-width: 200px; 
          height: auto; 
          margin-bottom: 20px;
          filter: drop-shadow(4px 4px 0px rgba(71, 56, 42, 0.2));
        ">
        <div style="
          width: 150px;
          height: 10px;
          background: rgba(106, 153, 78, 0.2);
          border-radius: 5px;
          overflow: hidden;
          position: relative;
        ">
          <div id="loader-bar" style="
            position: absolute;
            height: 100%;
            width: 30%;
            background: #6a994e;
            border-radius: 5px;
          "></div>
        </div>
        <p style="color: #47382a; margin-top: 15px; font-weight: bold; font-size: 1.2rem;">Ladataan Mölymetsää...</p>
        
        <style>
          @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
          }
          #loader-bar {
            animation: slide 1.5s infinite ease-in-out;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
