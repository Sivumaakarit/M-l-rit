    <style>

  <body>
    <div id="root">
      <!-- Loading Screen / Splash Screen -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7fefc;
        z-index: 9999;
        font-family: 'Quicksand', sans-serif;
      ">
        <img src="/logo.webp" alt="Mölyapinat" style="
          width: 50vw; 
          max-width: 220px; 
          height: auto; 
          margin-bottom: 24px;
          filter: drop-shadow(6px 6px 0px rgba(21, 45, 33, 0.15));
        ">
        <div style="
          width: 180px;
          height: 12px;
          background: rgba(22, 101, 52, 0.1);
          border-radius: 12px;
          overflow: hidden;
          position: relative;
          border: 2px solid rgba(21, 45, 33, 0.05);
        ">
          <div id="loader-bar" style="
            position: absolute;
            height: 100%;
            width: 40%;
            background: #16a34a;
            border-radius: 12px;
          "></div>
        </div>
        <p style="color: #111827; margin-top: 20px; font-weight: 800; font-size: 1.4rem; letter-spacing: -0.02em;">Mölymetsä herää eloon...</p>
        
        <style>
          @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(350%); }
          }
          #loader-bar {
            animation: slide 1.2s infinite ease-in-out;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
