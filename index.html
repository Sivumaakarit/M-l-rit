<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Mölyapinat - Energinen lastenmusiikkibändi keikalle ja tapahtumiin</title>
    
    <meta name="description" content="Mölyapinat on paras lastenmusiikkibändi keikalle, synttäreille ja koko perheen tapahtumiin. Tilaa Mölymetsän seikkailu ja nauti iloisesta musiikista!" />

    <link rel="icon" type="image/png" href="/apinalogo.png" />

    <meta property="og:title" content="Mölyapinat - Suomen kivoin lasten musiikkibändi" />
    <meta property="og:description" content="Tervetuloa Mölymetsään! Tilaa Mölyapinat tuomaan iloa, musiikkia ja liikettä koko perheelle." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://molyapinat.fi/apinalogo.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/apinalogo.png" />
    
    <link rel="preload" as="image" href="/logo.webp" fetchpriority="high" />
    <style>
      :root {
        --background: 45 100% 96%; --foreground: 25 40% 20%;
        --primary: 48 100% 55%; --wood-dark: 25 35% 22%;
        --font-body: 'Quicksand', sans-serif;
      }
      body { background-color: hsl(var(--background)); color: hsl(var(--foreground)); margin: 0; font-family: var(--font-body); }
      .wood-clean {
        background: linear-gradient(to bottom, hsl(35 40% 92%) 0%, hsl(35 40% 95%) 50%, hsl(35 30% 88%) 100%);
        border: 3px solid hsl(var(--wood-dark)); box-shadow: 4px 4px 0px hsl(var(--wood-dark));
      }
      .wood-texture {
        background: linear-gradient(to bottom, hsl(35 45% 78%) 0%, hsl(35 45% 82%) 15%, hsl(35 45% 75%) 16%, hsl(32 40% 72%) 20%, hsl(35 45% 80%) 50%, hsl(32 40% 74%) 80%, hsl(35 45% 75%) 84%, hsl(35 42% 76%) 100%);
        background-size: 100% 40px; border: 3px solid hsl(var(--wood-dark)); box-shadow: 4px 4px 0px hsl(var(--wood-dark));
      }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Quicksand:wght@400;500;600;700&display=swap" />
    </noscript>
    <link rel="canonical" href="https://molyapinat.fi" />
  </head>

  <body>
    <div id="root">
      <!-- Loading Screen / Splash Screen -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f7f2ea;
        z-index: 9999;
        font-family: 'Quicksand', sans-serif;
      ">
        <img src="/logo.webp" alt="Mölyapinat" style="
          width: 50vw; 
          max-width: 200px; 
          height: auto; 
          margin-bottom: 20px;
          filter: drop-shadow(4px 4px 0px rgba(71, 56, 42, 0.2));
        ">
        <div style="
          width: 150px;
          height: 10px;
          background: rgba(106, 153, 78, 0.2);
          border-radius: 5px;
          overflow: hidden;
          position: relative;
        ">
          <div id="loader-bar" style="
            position: absolute;
            height: 100%;
            width: 30%;
            background: #6a994e;
            border-radius: 5px;
          "></div>
        </div>
        <p style="color: #47382a; margin-top: 15px; font-weight: bold; font-size: 1.2rem;">Ladataan Mölymetsää...</p>
        
        <style>
          @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
          }
          #loader-bar {
            animation: slide 1.5s infinite ease-in-out;
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
